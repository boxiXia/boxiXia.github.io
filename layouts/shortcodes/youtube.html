{{- /* Lightweight YouTube: a thumbnail until clicked, then the real player. Overrides Hugo's built-in. */ -}}
{{- $id := .Get "id" | default (.Get 0) -}}
<div class="yt" data-id="{{ $id }}">
  <button type="button" aria-label="Play video on YouTube"><img src="https://i.ytimg.com/vi/{{ $id }}/hqdefault.jpg" alt="" loading="lazy" decoding="async"><span class="yt-play"></span></button>
</div>
