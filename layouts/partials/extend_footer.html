<div id="lb-overlay" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button id="lb-close" aria-label="Close">&times;</button>
  <img id="lb-img" src="" alt="">
</div>
<script>
(function(){
  var overlay=document.getElementById('lb-overlay'),
      img=document.getElementById('lb-img'),
      close=document.getElementById('lb-close');
  function open(src,alt){img.src=src;img.alt=alt||'';overlay.classList.add('open');document.body.style.overflow='hidden';}
  function shut(){overlay.classList.remove('open');img.src='';document.body.style.overflow='';}
  overlay.addEventListener('click',function(e){if(e.target===overlay||e.target===close)shut();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')shut();});
  document.querySelectorAll('img[data-lb]').forEach(function(el){
    el.style.cursor='zoom-in';
    el.addEventListener('click',function(){open(el.dataset.lb||el.src,el.alt);});
  });
})();
</script>
