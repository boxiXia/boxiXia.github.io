# Hugo site configuration in YAML format
baseURL: https://boxixia.github.io/
languageCode: en-us
title: Boxi Xia
theme: PaperMod

# Pagination settings
pagination:
  pagerSize: 50

# Site parameters
params:
  env: production
  description: Boxi Xia, roboticist at Duke University. Embodied intelligence, robot design, humanoid and legged robots, and sim-to-real reinforcement learning.
  author: Boxi Xia

  # Theme settings
  defaultTheme: auto  # auto, light, or dark
  disableThemeToggle: false

  # Display settings
  ShowReadingTime: false
  ShowWordCount: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: false
  ShowToc: false
  TocOpen: false

  # SEO and Meta
  keywords:
    - robotics
    - embodied intelligence
    - field robotics
    - humanoid manipulation
    - dexterous manipulation
    - robot hands
    - space robotics
    - humanoid robots
    - legged locomotion
    - soft robotics
    - reinforcement learning
    - machine learning
    - robot design
    - bipedal locomotion
    - quadrupedal robots
    - physics simulation
    - robot control

  # Date format
  DateFormat: January 2, 2006

  # Comments - uncomment and configure if needed
  # comments:
  #   disqus: your-disqus-shortname

  # Google Analytics - uncomment and add your ID
  # googleAnalytics: G-XXXXXXXXXX

  # Profile mode (homepage)
  profileMode:
    enabled: true
    title: Boxi Xia
    subtitle: Postdoctoral Associate, Duke University · Embodied intelligence and robot design
    # Add your profile image: create static/images/profile.jpg and uncomment below
    # imageUrl: /images/profile.jpg
    imageTitle: Profile
    imageWidth: 120
    imageHeight: 120


  # Uncomment and add more social links as needed
  # - name: twitter
  #   url: https://twitter.com/yourhandle
  # - name: stackoverflow
  #   url: https://stackoverflow.com/users/userid

  # Home page info (alternative to profile mode)
  # homeInfoParams:
  #   Title: Hi there!
  #   Content: Welcome to my personal website

  # Cover image for posts (default)
  cover:
    linkFullImages: true
    responsiveImages: true

  # Edit post link - disabled (not useful for academic portfolio)
  # editPost:
  #   URL: https://github.com/boxiXia/boxiXia.github.io/tree/master/content
  #   Text: Suggest Changes
  #   appendFilePath: true

# Search functionality
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Navigation menu
menu:
  main:
    # - identifier: posts
    #   name: Posts
    #   url: /posts/
    #   weight: 10
    # - identifier: tags
    #   name: Tags
    #   url: /tags/
    #   weight: 20
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 25
    - identifier: gallery
      name: Gallery
      url: /gallery/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

# Taxonomies (tags and categories)
taxonomies:
  category: categories
  tag: tags
  series: series

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML in markdown
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
    style: monokai

# Privacy settings
privacy:
  vimeo:
    disabled: false
    simple: true
  x:
    disabled: false
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true
